name: Release

on:
  # Manual only: a release must be a deliberate act, not a side effect of every
  # push to main. Run it from Actions -> Release -> Run workflow.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          # Get current date
          DATE_VERSION="v$(date +'%Y.%m.%d')"
          
          # Check for existing tags with this prefix
          EXISTING_TAGS=$(git tag --list "${DATE_VERSION}*")
          
          if [ -z "$EXISTING_TAGS" ]; then
            VERSION="$DATE_VERSION"
          else
            # Find the highest suffix
            COUNT=$(echo "$EXISTING_TAGS" | wc -l)
            VERSION="${DATE_VERSION}.${COUNT}"
          fi
          
          echo "Calculated version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        env:
          # The calculated version is a step output, not a shell variable.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Determine the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "Previous tag: $PREV_TAG"
          
          # Generate changelog header
          echo "## Release $VERSION" > release_notes.md
          echo "" >> release_notes.md
          echo "**Date**: $(date +'%Y-%m-%d')" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Changes" >> release_notes.md
          echo "" >> release_notes.md
          
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, list all commits
            git log --pretty=format:"- %s (%h)" >> release_notes.md
          else
            # List commits since last tag
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> release_notes.md
          fi
          
          # Blank line before the next entry: git log --pretty=format: leaves no
          # trailing newline, so the last bullet needs terminating + one blank.
          printf '\n\n' >> release_notes.md

          # Append to main CHANGELOG.md (prepend actually)
          if [ -f CHANGELOG.md ]; then
            cat release_notes.md CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            cat release_notes.md > CHANGELOG.md
          fi

      - name: Update Script Version
        run: |
          # Update the version in the script if it exists
          # We will look for VERSION="..." or similar pattern
          if grep -q 'VERSION=' update-my-mac.sh; then
            sed -i "s/VERSION=.*/VERSION=\"${{ steps.version.outputs.version }}\"/" update-my-mac.sh
          fi

      - name: Commit Changelog and Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CHANGELOG.md update-my-mac.sh
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): prepare release ${{ steps.version.outputs.version }}"
            git push origin main
          fi

      - name: Verify packaged tree
        run: |
          # The script needs lib/cooldown.py to run its Homebrew cooldown gate.
          # Shipping the bare .sh would produce an install that refuses to
          # upgrade anything, so fail here instead of in the field.
          test -f update-my-mac.sh || { echo "update-my-mac.sh missing"; exit 1; }
          test -f lib/cooldown.py || { echo "lib/cooldown.py missing - cannot package"; exit 1; }
          python3 - "$PWD" <<'PY'
          import ast, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          ast.parse((root / "lib/cooldown.py").read_text())  # syntax gate
          sh = (root / "update-my-mac.sh").read_text()
          for needed in ("lib/cooldown.py", "INSTALL_LIBDIR", "install_script"):
              if needed not in sh:
                  sys.exit(f"update-my-mac.sh does not reference {needed}")
          print("packaged tree verified")
          PY

      - name: Build release artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="update-my-mac-${VERSION}"
          mkdir -p "dist/${NAME}/lib"
          cp update-my-mac.sh README.md CHANGELOG.md LICENSE "dist/${NAME}/"
          cp lib/cooldown.py "dist/${NAME}/lib/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          # Stable asset name for the one-line installer:
          # https://github.com/<repo>/releases/latest/download/update-my-mac.tar.gz
          cp "dist/${NAME}.tar.gz" dist/update-my-mac.tar.gz
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" \
                    && sha256sum update-my-mac.tar.gz > update-my-mac.tar.gz.sha256 )
          tar -tzf "dist/${NAME}.tar.gz"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/update-my-mac-${{ steps.version.outputs.version }}.tar.gz
            dist/update-my-mac-${{ steps.version.outputs.version }}.tar.gz.sha256
            dist/update-my-mac.tar.gz
            dist/update-my-mac.tar.gz.sha256
            install.sh
            CHANGELOG.md
